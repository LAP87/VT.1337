#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
##	Connected to X-MOT (B Motor)
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: can0:PB8 #tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 40   #Max 100
homing_retract_dist: 0
homing_positive_dir: True

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PF2
interpolate: False
run_current: 1.0
#hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold: 0
#diag_pin: ^PB14 # use the same pin that was previously the endstop_pin!
#driver_SGTHRS: 65
driver_TBL: 3
driver_TOFF: 8
driver_HSTRT: 0
driver_HEND: 0

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG13 #tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355

##--------------------------------------------------------------------
homing_speed: 40  #Max 100
homing_retract_dist: 0
homing_positive_dir: True

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PC7
interpolate: False
run_current: 1.0
#hold_current: 0.4
sense_resistor: 0.110
#stealthchop_threshold: 0
#diag_pin: ^PB13 # use the same pin that was previously the endstop_pin!
#driver_SGTHRS: 65
driver_TBL: 3
driver_TOFF: 8
driver_HSTRT: 0
driver_HEND: 0

#####################################################################
#   Z Stepper Settings
#####################################################################

## In E-MOT3 Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 64
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0
##  In Z- Position
#endstop_pin: ^PA0
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
position_max: 250

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC4
interpolate: False
run_current: 0.7
#hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

##	In E2-MOT Position
##	Z1 Stepper - Rear
[stepper_z1]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 64

[tmc2209 stepper_z1]
uart_pin: PD11
interpolate: False
run_current: 0.7
#hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

##	In E1-MOT Position
##	Z2 Stepper - Front Right
[stepper_z2]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 64

[tmc2209 stepper_z2]
uart_pin: PC6
interpolate: False
run_current: 0.7
#hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
##	SSR Pin - In BED OUT position
heater_pin: PA1
sensor_type: Generic 3950 # NTC 100K MGB18-104F39050L32
sensor_pin: PF3 # TB Position
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 1.0
min_temp: -15
max_temp: 120

#####################################################################
#	Probe
#####################################################################

[bed_mesh]
speed: 350
horizontal_move_z: 3
mesh_min: 30,30 #20, 22
mesh_max: 320,320 #330, 328
probe_count: 25,25 #16, 16
mesh_pps: 0, 0
algorithm: bicubic
bicubic_tension: 0.5
#relative_reference_index: 612
move_check_distance: 3
split_delta_z: 0.01
adaptive_margin: 5

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_370329FA5154354D38202020FF0A2A0F-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 21.953 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 150 # increase to probe at print temps
home_xy_position: 175, 175 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 20
home_xy_move_speed: 300
home_method: contact # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home

[resonance_tester]
accel_chip: beacon
probe_points: 175, 175, 20

#####################################################################
#	Fan Control
#####################################################################

[heater_fan controller_fan]
##	Controller fan - FAN2 Connector
pin: PA8
kick_start_time: 0.5
heater: heater_bed
heater_temp: 60.0
fan_speed: 0.4

[multi_pin AUX]
pins: PE5,PD12

[fan_generic AUX]
pin: multi_pin:AUX
max_power: 1.0
shutdown_speed: 0
#   The desired fan speed (expressed as a value from 0.0 to 1.0) if
#   the micro-controller software enters an error state. The default
#   is 0.
cycle_time: 0.010
#   The amount of time (in seconds) for each PWM power cycle to the
#   fan. It is recommended this be 10 milliseconds or greater when
#   using software based PWM. The default is 0.010 seconds.
kick_start_time: 0.100
off_below: 0.0
#   This setting should be recalibrated whenever max_power is adjusted.
#   To calibrate this setting, start with off_below set to 0.0 and the
#   fan spinning. Gradually lower the fan speed to determine the lowest
#   input speed which reliably drives the fan without stalls. Set
#   off_below to the duty cycle corresponding to this value (for
#   example, 12% -> 0.12) or slightly higher.

[gcode_macro M106]
description: "Set fan speed (Orca compatible)"
rename_existing: M106.1
gcode:
    {% set p = params.P|default(0)|int %}
    {% set s = params.S|default(255)|int %}
    
    {% if p == 0 %}
        # P0 är huvudfläkten [fan] -> Använd original M106-kommandot
        M106.1 S{s}
    {% elif p == 2 %}
        # P2 är AUX [fan_generic] -> Använd SET_FAN_SPEED (kräver 0.0-1.0)
        # S255 / 255.0 blir 1.0
        SET_FAN_SPEED FAN=AUX SPEED={s / 255.0}
    {% elif p == 3 %}
        # P3 Exempel för Exhaust/Chamber om du har det
        # SET_FAN_SPEED FAN=EXHAUST SPEED={s / 255.0}
    {% else %}
       # Okänt P-värde, ignorera eller varna
       RESPOND PREFIX="warn" MSG="Unknown fan index P"~p
    {% endif %}

[gcode_macro M107]
description: "Turn off fans. No P = all, P# = specific"
rename_existing: M107.1
gcode:
    {% set p = params.P|default(-1)|int %}

    {% if p == -1 %}
        # Inget P angivet -> Stäng av ALLT
        M106.1 S0            ; Stäng av [fan]
        SET_FAN_SPEED FAN=AUX SPEED=0
        # SET_FAN_SPEED FAN=EXHAUST SPEED=0
    {% elif p == 0 %}
        # Stäng av bara [fan]
        M106.1 S0
    {% elif p == 2 %}
        # Stäng av bara AUX
        SET_FAN_SPEED FAN=AUX SPEED=0
    {% else %}
        RESPOND PREFIX="warn" MSG="Unknown fan index P"~p
    {% endif %}

