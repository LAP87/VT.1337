[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_270016001951313236343430-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 350 #710
max_accel: 6000 #47825
#max_accel_to_decel: 3000
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 6

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 74.8
damping_ratio_x: 0.030
shaper_type_y: mzv
shaper_freq_y: 47.2
damping_ratio_y: 0.038

#[autotune_tmc stepper_x]
#motor: fysetc-17HS19-2004S-C
#sg4_thrs: 65
#[autotune_tmc stepper_y]
#motor: fysetc-17HS19-2004S-C
#sg4_thrs: 65

#[autotune_tmc stepper_z]
#motor: fysetc-42HC40-204A-300N84
#[autotune_tmc stepper_z1]
#motor: fysetc-42HC40-204A-300N84
